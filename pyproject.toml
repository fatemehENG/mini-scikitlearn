
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sklearn"
version = "0.1.0"
description = "A small machine learning library implemented with Python and NumPy."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
include = ["minislearn*"]
